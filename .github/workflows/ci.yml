name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-extras --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-extras --group dev
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-extras --group dev
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: python -m venv /tmp/terminologia-base
      - run: python -m venv /tmp/terminologia-mcp
      - run: wheel=$(printf '%s\n' dist/*.whl) && /tmp/terminologia-base/bin/pip install "$wheel"
      - run: /tmp/terminologia-base/bin/python -c "import terminologia"
      - run: if /tmp/terminologia-base/bin/python -c "import mcp"; then exit 1; fi
      - run: wheel=$(printf '%s\n' dist/*.whl) && /tmp/terminologia-mcp/bin/pip install "${wheel}[mcp]"
      - run: |
          /tmp/terminologia-mcp/bin/python - <<'PY'
          import asyncio
          import sys

          from mcp.client.session import ClientSession
          from mcp.client.stdio import StdioServerParameters, stdio_client

          async def check():
              parameters = StdioServerParameters(
                  command=sys.executable,
                  args=["-m", "terminologia", "mcp"],
              )
              async with stdio_client(parameters) as (read_stream, write_stream):
                  async with ClientSession(read_stream, write_stream) as session:
                      initialized = await session.initialize()
                      tools = await session.list_tools()
                      assert initialized.serverInfo.name == "terminologia"
                      assert {tool.name for tool in tools.tools} == {
                          "terminologia_buscar",
                          "terminologia_lookup",
                          "terminologia_validar",
                          "terminologia_traduzir",
                          "terminologia_sistemas",
                      }

          asyncio.run(check())
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  distribuicao:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar registro MCP
        env:
          MCP_PUBLISHER_VERSION: 1.8.2
          MCP_PUBLISHER_SHA256: d0554112d8f7affad9a10041776d63129a60b163c05036ae26caf73ecbbd89c8
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output mcp-publisher.tar.gz
          printf '%s  mcp-publisher.tar.gz\n' "$MCP_PUBLISHER_SHA256" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate server.json
